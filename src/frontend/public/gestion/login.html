<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="navbar"></div>
    <script src="/js/navbar.js"></script>


    <div class="container">
        <div id="alerts"></div>
        <h1>Connexion</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input class="form-control" name="username" type="text" placeholder="Entrez votre nom d'utilisateur" />
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input class="form-control" name="password" type="password" placeholder="Entrez votre email" />
            </div>

            <button class="btn btn-primary" type="submit">Se Connecter</button>
        </form>
    </div>

    <div id="footer"></div>
    <script src="/js/footer.js"></script>
    <script src="/js/alerts.js"></script>

    <script>
        if (localStorage.getItem("token")) window.location.href = "/dashboard"

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = e.target.username.value;
            const password = e.target.password.value;

            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (!data.token) {
                showAlertDanger(data.message)
            }
            else {
                // store token
                localStorage.setItem("token", data.token);
                showAlertSuccess("Connexion reussie")
                setTimeout(()=>{window.location.href = "/dashboard"}, 1000)
            }

        });
    </script>
</body>

</html>
