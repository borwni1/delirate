<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="navbar"></div>
    <script src="/js/navbar.js"></script>

    <div class="container">
        <div id="alerts">

        </div>
        <h1>Parametres</h1>
        <form id="editForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" name="username" type="text" id="username">
            </div>
            <div class="form-group">
                <label for="email">Addresse Email</label>
                <input class="form-control" name="email" type="text" id="email">
            </div>
            <div class="form-group">
                <label for="roles">Role</label>
                <select id="roles" name="roles" class="form-select" aria-label="Default select example">
            </div>
            </select>
            <button class="btn btn-primary" type="submit">Confirmer les modifications</button>
        </form>
    </div>

    <div id="footer"></div>
    <script src="/js/footer.js"></script>

    <script src="/js/alerts.js"></script>

    <script>
        if (!localStorage.getItem("token")) window.location.href = "/";
    </script>

    <script>
        const token = localStorage.getItem("token");
        async function loadSettings() {
            try {
                if (!token) window.location.href = "/";

                const res = await fetch("/api/me", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                })

                if (!res.ok) throw new Error("The HTTP request did not succeed")

                const data = await res.json();
                document.getElementById("username").value = await data.username
                document.getElementById("email").value = await data.email

                await data.availableRoles.forEach(role => {
                    const option = document.createElement("option")
                    option.value = role
                    option.textContent = role;

                    if (role == data.role) {
                        option.selected = true;
                        // option.textContent += "*"
                    }
                    document.getElementById("roles").appendChild(option)
                });
            } catch (error) {
                console.error(error)
                showAlertDanger(data.message)
                window.location.href = "/"
            }
        }
        loadSettings()

        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                const username = e.target.username.value;
                const email = e.target.email.value;
                const role = e.target.roles.value;

                const res = await fetch("/api/me/edit", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, email, role })
                })

                if (!res.ok) throw new Error("The HTTP request did not succeed")

                const data = await res.json();

                if (!data) {
                    throw new Error(data.message)
                } else {
                    showAlertSuccess(data.message)
                }

            } catch (error) {
                showAlertDanger(error.message)
                console.error(error)
                // window.location.href = "/"
            }
        });
    </script>
</body>

</html>
