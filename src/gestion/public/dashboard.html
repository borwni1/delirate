<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <div id="navbar"></div>
    <script src="/js/navbar.js"></script>

    <div class="container">

        <h1>Dashboard</h1>
        <div class="card">
            <h5 class="card-header">Information de compte</h5>
            <div class="card-body">
                <h5 class="card-title">Bienvenue <span id="username"></span></h5>
                <p class="card-text">Vous etes: <span id="role"></span></p>
                <a href="/settings" class="btn btn-primary" id="editProfileBtn">Modifier votre profil</a>
            </div>
        </div>

        <div id="createRestaurant">
            <h4>Creer un restaurant</h4>
            <form id="createRestaurantForm">
                <div class="form-group">
                    <label for="name">Nom du restaurant</label>
                    <input class="form-control" name="name" type="text" placeholder="Hawthorn">
                </div>

                <div class="form-group">
                    <label for="address">Addresse du restaurant</label>
                    <input class="form-control" name="address" type="text" placeholder="Timbuktu">
                </div>

                <button class="btn btn-primary" type="submit">Valider</button>
            </form>
        </div>
    </div>

    <script>
        if (!localStorage.getItem("token")) window.location.href = "/";
    </script>

    <script>
        // Dans un premier temps, completer le texte manquant
        const token = localStorage.getItem("token");
        async function loadDashboard() {
            try {
                if (!token) window.location.href = "/";

                const res = await fetch("/api/me", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!res.ok) throw new Error("Mauvais token / session expiree")

                const data = await res.json();

                document.getElementById("username").textContent = data.username;
                document.getElementById("role").textContent = data.role;

                if (data.hasRestaurant) document.getElementById("createRestaurant").classList.add("d-none")
            } catch (error) {
                console.error(error)
                window.location.href = "/"
            }
        }

        loadDashboard()
    </script>

    <script>
        async function createRestaurant() {
            document.getElementById("createRestaurantForm").addEventListener("submit", async (e) => {
                e.preventDefault()

                const name = e.target.name.value;
                const address = e.target.address.value;

                // requete vers un autre service
                const res = await fetch("/api/restaurant/create");

                if (!res.ok) throw new Error("Mauvais token / session expiree")

            })
        }
    </script>

    <div id="footer"></div>
    <script src="/js/footer.js"></script>
</body>

</html>
